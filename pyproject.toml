[project]
name = "lobework-sorting"
version = "0.2.0"
description = "极简 Python 项目：常见排序算法的实现与测试（冒泡、选择等）"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "lobework" }]
keywords = ["sorting", "bubble-sort", "selection-sort", "algorithms"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
bubble-sort = "bubble_sort:main"
selection-sort = "selection_sort:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["bubble_sort", "selection_sort"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
